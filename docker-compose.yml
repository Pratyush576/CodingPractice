# Local infra for the supplychain module — Postgres + a single-broker Kafka
# (KRaft mode, no Zookeeper). Zero cloud cost; see
# lib/src/main/java/org/pk/practices/design/supplychain/DESIGN.md §7 and
# LLD.md §1.1/§1.3 for what these stand in for at production scale.
#
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: supplychain
      POSTGRES_PASSWORD: supplychain
      POSTGRES_DB: supplychain
    volumes:
      - supplychain-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplychain"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MTIzNDU2Nzg5MGFiY2RlZg==

  cabreservation-postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: cabreservation
      POSTGRES_PASSWORD: cabreservation
      POSTGRES_DB: cabreservation
    volumes:
      - cabreservation-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabreservation"]
      interval: 5s
      timeout: 5s
      retries: 10

  # No volume — the geo index is a fully rebuildable derived index (drivers
  # re-populate it by going online/pinging again after a restart), unlike
  # Postgres above which holds source-of-truth state.
  cabreservation-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  servicesmarketplace-postgres:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: servicesmarketplace
      POSTGRES_PASSWORD: servicesmarketplace
      POSTGRES_DB: servicesmarketplace
    volumes:
      - servicesmarketplace-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicesmarketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  supplychain-postgres-data:
  cabreservation-postgres-data:
  servicesmarketplace-postgres-data:
